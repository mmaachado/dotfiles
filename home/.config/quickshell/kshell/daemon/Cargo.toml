[package]
name = "kshelld"
version = "0.1.0"
edition = "2024"
description = "Backend daemon for KShell: KWin bridge, theme apply, global shortcuts, Material 3 schemes"
license = "MIT"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
material-colors = { version = "0.5", features = ["quantize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "signal", "time", "sync", "fs"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

[profile.release]
lto = "thin"
strip = true
