<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- droid: Google Sans Flex for the interface and Google Sans Code for code,
     like Android. Apps that just ask for sans-serif, system-ui or monospace
     get these; Noto covers scripts and emoji they don't have. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>GoogleSansCode Nerd Font</family>
      <family>Google Sans Code</family>
      <family>Noto Sans Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
