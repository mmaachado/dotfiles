# kitty — colours, opacity and blur come from the active KShell theme
# (generated by kshelld from config/themes.json, reloaded live).
include ~/.local/state/kshell/kitty-theme.conf

# droid's monospace font, like Android Studio's: Google Sans Code with Nerd
# Fonts glyphs, so starship and fastfetch icons render.
font_family      GoogleSansCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
