name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DAEMON: home/.config/quickshell/kshell/daemon
  SHADERS: home/.config/quickshell/kshell/shaders

jobs:
  # The checks are `just` recipes (see the justfile), so CI and
  # `just lint` locally run exactly the same commands.
  rust:
    name: kshelld (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DAEMON }}
      - run: just lint-rust
      - run: just test

  python:
    name: Installer and manifest (ruff, droid.toml, config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          src: installer install.py scripts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: just lint-config

  shell:
    name: Scripts (shellcheck, zsh -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: sudo apt-get install -y --no-install-recommends zsh
      - run: just lint-shell

  shaders:
    name: Shaders compile
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed qt6-shadertools git
      - uses: actions/checkout@v7
      - name: Compile every shader with qsb
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for f in "$SHADERS"/*.frag; do
            /usr/lib/qt6/bin/qsb --qt6 -o "$f.qsb" "$f"
          done
      # qsb output depends on the Qt version, which moves with Arch, so a
      # difference is a hint to recompile rather than a failure.
      - name: Committed .qsb files are up to date
        run: |
          if ! git diff --quiet -- "$SHADERS"; then
            echo "::warning::Some .qsb files differ from a fresh compile. Recompile them with just shaders"
            git diff --stat -- "$SHADERS"
          fi

  apps:
    name: Kotlin apps (gradle build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
        working-directory: apps

  commits:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      KOTLIN: "2.4.21"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Kotlin compiler (checksum-verified)
        run: |
          base=https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN
          curl -sfLO "$base/kotlin-compiler-$KOTLIN.zip"
          echo "$(curl -sfL "$base/kotlin-compiler-$KOTLIN.zip.sha256" | cut -d' ' -f1)  kotlin-compiler-$KOTLIN.zip" | sha256sum -c -
          unzip -q "kotlin-compiler-$KOTLIN.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - run: kotlin scripts/commit-msg.main.kts --range "origin/${{ github.base_ref }}..HEAD"

  # QML isn't linted: qmllint can't resolve Quickshell's qs.* modules
  # without a running Quickshell, so it would only report false errors.
