version: 2
updates:
  # kshelld's crates.
  - package-ecosystem: cargo
    directory: /home/.config/quickshell/kshell/daemon
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      crates:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]
