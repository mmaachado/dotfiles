[packages.core]
description = "zsh shell, prompt and CLI tools"
repo = [
    "zsh",
    "starship",
    "fastfetch",
    "tree",
    "curl",
    "git",
    "pacman-contrib",
    "fzf",
    "ttf-jetbrains-mono-nerd",
    "ttf-nerd-fonts-symbols",
    "ttf-nerd-fonts-symbols-mono",
    "noto-fonts-cjk",
]

[packages.kshell]
description = "KShell: the Quickshell layer on top of KDE Plasma"
repo = [
    "quickshell",
    "python-gobject",
    "qt6-tools",
    "kconfig",
    "kde-cli-tools",
    "kdbusaddons",
    "networkmanager",
    "pipewire",
    "wireplumber",
    "upower",
    "plasma-workspace",
    "kvantum",
]

[packages.optional]
description = "Nice to have: zsh plugins, CLI tools and Bluetooth"
optional = true
repo = [
    "zsh-autosuggestions",
    "zsh-syntax-highlighting",
    "zsh-completions",
    "zsh-history-substring-search",
    "zoxide",
    "eza",
    "bat",
    "fd",
    "bluez",
    "bluez-utils",
]
aur = []

[links]
paths = [
    ".zshrc",
    ".zprofile",
    ".config/zsh",
    ".config/starship.toml",
    ".config/fastfetch",
    ".config/kitty/kitty.conf",
    ".config/quickshell/kshell",
    ".local/bin/kshell",
    ".local/bin/pacman_updates",
]

[wallpapers]
dir = "~/Pictures/Wallpapers"
