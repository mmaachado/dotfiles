# droid: a Plasma-based Quickshell desktop. This file holds the release
# details and what the installer (install.py) sets up.

[release]
name = "droid"
version = "1.1.0"
# Each major version takes the next Android dessert (1.x Cupcake, 2.x Donut,
# then Eclair, ...); minor releases keep the codename. See RELEASES.md.
codename = "Cupcake"
description = "Plasma-based Quickshell desktop"

[packages.core]
description = "zsh shell, prompt and CLI tools"
repo = [
    "zsh",
    "starship",
    "fastfetch",
    "tree",
    "curl",
    "git",
    "pacman-contrib",
    "fzf",
    "ttf-nerd-fonts-symbols",
    "ttf-nerd-fonts-symbols-mono",
    "noto-fonts-cjk",
]

[packages.fonts]
description = "Google Sans Code (monospace) and Noto fallbacks; Google Sans Flex comes from [[fonts]]"
repo = ["ttf-googlesanscode-nerd", "noto-fonts", "noto-fonts-emoji"]

# Fonts the installer fetches itself (`./install.py fonts`) into
# ~/.local/share/fonts/droid. Google Sans Flex isn't in the Arch repos, and
# the AUR package broke when google/fonts renamed the file, so it comes
# straight from google/fonts, pinned to a commit and checked by sha256.
[[fonts]]
family = "Google Sans Flex"
files = [
    { name = "GoogleSansFlex[ROND,opsz,slnt,wdth,wght].ttf", url = "https://raw.githubusercontent.com/google/fonts/fa826bb2a3e26df8c1bee99351fc0d039aeed7d2/ofl/googlesansflex/GoogleSansFlex%5BROND,opsz,slnt,wdth,wght%5D.ttf", sha256 = "a9ac770798857d5e8ac593ced42b22e40a7c08cec98319f92b0eccc2783a77ba" },
    { name = "GoogleSansFlex-OFL.txt", url = "https://raw.githubusercontent.com/google/fonts/fa826bb2a3e26df8c1bee99351fc0d039aeed7d2/ofl/googlesansflex/OFL.txt", sha256 = "fc13d69f63e36d284b6e383d4d1463d8ad404f0aa065e57cf961252d51063137" },
]

[packages.kshell]
description = "KShell: the Quickshell layer on top of KDE Plasma"
repo = [
    "quickshell",
    "python-gobject",
    "qt6-tools",
    "kconfig",
    "kde-cli-tools",
    "kdbusaddons",
    "networkmanager",
    "pipewire",
    "wireplumber",
    "upower",
    "plasma-workspace",
    "kvantum",
]

[packages.dev]
description = "For working on droid: just, lefthook, Kotlin, Gradle, linters and the docs"
optional = true
repo = ["just", "kotlin", "gradle", "jdk21-openjdk", "shellcheck", "ruff", "mkdocs-material"]
# Only in the AUR as a package; PyPI ships the same binary.
uv = ["lefthook"]

[packages.phone]
description = "Phone mirroring (droid Phone): scrcpy and adb"
optional = true
repo = ["scrcpy", "android-tools"]

[packages.ai]
description = "AI plan usage beside the tray (ai-usagebar: Claude, Codex, Copilot, ...)"
optional = true
# Not in the Arch repos; built from crates.io into ~/.local (no AUR).
cargo = ["ai-usagebar"]

[packages.optional]
description = "Nice to have: zsh plugins, CLI tools and Bluetooth"
optional = true
repo = [
    "zsh-autosuggestions",
    "zsh-syntax-highlighting",
    "zsh-completions",
    "zsh-history-substring-search",
    "zoxide",
    "eza",
    "bat",
    "fd",
    "bluez",
    "bluez-utils",
    "ttf-jetbrains-mono-nerd",
]
aur = []

[links]
paths = [
    ".zshrc",
    ".zprofile",
    ".config/zsh",
    ".config/starship.toml",
    ".config/fastfetch",
    ".config/kitty/kitty.conf",
    ".config/fontconfig/conf.d/60-droid-fonts.conf",
    ".config/quickshell/kshell",
    ".local/bin/kshell",
    ".local/bin/pacman_updates",
]

[wallpapers]
dir = "~/Pictures/Wallpapers"
